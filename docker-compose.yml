services:
  postgres_db:
    image: postgres:15-alpine
    container_name: asakabankbot_db_new
    environment:
      POSTGRES_USER: junior
      POSTGRES_PASSWORD: junicraft2512
      POSTGRES_DB: asakabankbot
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  rabbitmq_mq:
    image: rabbitmq:3.12-management-alpine
    container_name: asakabankbot_rmq_new
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: adminpassword
    ports:
      - "5673:5672" # Порт для подключения Go-приложения
      - "15673:15672" # Порт для веб-интерфейса RabbitMQ
    volumes:
      - rmqdata:/var/lib/rabbitmq
    restart: unless-stopped

  bot:
    build: .
    container_name: asakabankbot_app_new
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Внутри Docker обращаемся к сервисам по их именам, а не через localhost
      - DB_URL=postgres://junior:junicraft2512@postgres_db:5432/asakabankbot?sslmode=disable
      - RABBITMQ_URL=amqp://admin:adminpassword@rabbitmq_mq:5672/
    depends_on:
      - postgres_db
      - rabbitmq_mq

volumes:
  pgdata:
  rmqdata:
